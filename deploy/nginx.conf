worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 10;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    limit_req_zone $server_name zone=site:1m rate=60r/s;
    limit_req_zone $server_name zone=api:1m rate=5r/s;
    limit_req_status 429;
    map $http_cf_connecting_ip $client_address {
        default $http_cf_connecting_ip;
        "" $remote_addr;
    }
    map $uri $cache_control {
        ~^/api/ "no-store";
        default "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $cache_control always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            limit_req zone=site burst=120 nodelay;
            try_files $uri $uri/ =404;
        }

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            client_max_body_size 128k;
            proxy_pass http://leaderboard:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $client_address;
            proxy_set_header Origin $http_origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }

        location ~ /\. { return 404; }
    }
}
